[project]
name = "traditional-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vijay Jadon", email = "vijaypratapsinghjadon22@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain>=1.4.5",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.10",
    "openpyxl>=3.1.5",
    "pymupdf>=1.28.2",
    "pypdf>=6.20.1",
    "unstructured[xlsx]>=0.18.32",
]

[project.scripts]
traditional-rag = "traditional_rag:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
